name: hourly-pipeline

on:
  workflow_dispatch:
  schedule:
   - cron: "5 * * * *"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Hourly Pipeline
        run: python -m src.flows.hourly

      - name: Save Pipeline Outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: |
            reports/
            data/warehouse/
            logs/